<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Chat</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#fff; --line:#e5e2dc; --text:#1c1b19;
    --muted:#78736c; --accent:#3b6ea5; --user:#eef2f7; --chip:#f0eeea;
    --err:#b3261e; --warn:#a8620a;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1a1917; --panel:#232220; --line:#37352f; --text:#eceae5;
           --muted:#9c968c; --accent:#7aa5d2; --user:#2b3441; --chip:#2f2d29;
           --err:#f2857c; --warn:#e0a458; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:10px;align-items:center;padding:10px 16px;
         border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:14px;font-weight:600;margin:0 auto 0 0}
  select,button{font:inherit;font-size:13px;color:var(--text);background:var(--panel);
         border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
  select{max-width:220px}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  #log{flex:1;overflow-y:auto;padding:20px 16px}
  .wrap{max-width:820px;margin:0 auto}
  .msg{margin-bottom:18px}
  .who{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
       color:var(--muted);margin-bottom:5px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px;
          padding:11px 14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .user .bubble{background:var(--user)}
  .err .bubble{border-color:var(--err);color:var(--err)}
  .meta{font-size:11px;color:var(--muted);margin-top:5px}
  .files{font-size:12px;color:var(--muted);margin-top:7px}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
  #chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;
        padding:3px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
  .chip b{font-weight:500}
  .chip span{color:var(--muted)}
  .chip button{border:0;background:none;padding:0 2px;font-size:15px;line-height:1;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;font:inherit;color:var(--text);background:var(--bg);resize:none;
           border:1px solid var(--line);border-radius:9px;padding:10px 12px;
           min-height:44px;max-height:200px}
  textarea:focus{outline:0;border-color:var(--accent)}
  #send{background:var(--accent);color:#fff;border-color:var(--accent);padding:10px 18px}
  .hint{font-size:11px;color:var(--muted);margin-top:7px}
  .total{font-size:12px;color:var(--muted);white-space:nowrap;
         padding:5px 9px;border:1px solid var(--line);border-radius:7px}
  .total b{font-weight:600;color:var(--text)}
  .total.warn{border-color:var(--warn);color:var(--warn)}
  .total.warn b{color:var(--warn)}
  .cursor::after{content:"▋";animation:b 1s steps(2) infinite;color:var(--muted)}
  @keyframes b{0%,50%{opacity:1}51%,100%{opacity:0}}
</style>
</head>
<body>

<header>
  <h1>API Chat</h1>
  <select id="model"><option>loading models…</option></select>
  <select id="effort" title="reasoning effort">
    <option value="">effort: default</option>
    <option value="none">none</option>
    <option value="minimal">minimal</option>
    <option value="low">low</option>
    <option value="medium">medium</option>
    <option value="high">high</option>
    <option value="xhigh">xhigh</option>
    <option value="ultra">ultra</option>
    <option value="max">max</option>
  </select>
  <button id="addFiles">+ Files</button>
  <button id="addFolder">+ Folder</button>
  <button id="clear">Clear</button>
  <div id="total" class="total"></div>
</header>

<div id="log"><div class="wrap" id="logInner"></div></div>

<footer>
  <div class="wrap">
    <div id="chips"></div>
    <div class="row">
      <textarea id="input" rows="1" placeholder="Ask something…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</footer>

<input type="file" id="fileInput" multiple hidden>
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>

<script>
const $ = id => document.getElementById(id);
const logInner = $('logInner');

let history = [];      // conversation sent to the model
let attachments = [];  // [{path, content, bytes}]
let busy = false;
let sessionCost = 0, sessionTokens = 0, sessionTurns = 0;

// Rough token estimate for whatever we are about to resend every turn.
function contextTokens(){
  const chars = history.reduce((n,m)=>n + (m.content||'').length, 0)
              + attachments.reduce((n,a)=>n + a.content.length, 0);
  return Math.round(chars / 4);
}

function renderTotal(){
  const el = $('total');
  const ctx = contextTokens();
  if (!sessionTurns && !ctx){ el.textContent = ''; el.className = 'total'; return; }
  const bits = [];
  if (sessionTurns) bits.push('<b>$' + sessionCost.toFixed(4) + '</b> this session');
  if (sessionTokens) bits.push(sessionTokens.toLocaleString() + ' tok');
  if (ctx) bits.push('carrying ~' + ctx.toLocaleString() + '/msg');
  el.innerHTML = bits.join(' · ');
  // Flag when every further message is dragging a big context along.
  el.className = 'total' + (ctx > 20000 ? ' warn' : '');
}

// ---- which files are worth sending ----
const SKIP_DIR = /(^|\/)(\.git|node_modules|__pycache__|\.venv|venv|dist|build|\.next|target|\.idea|\.vscode|vendor|\.DS_Store)(\/|$)/;
// Never ship credentials to a third party. Matched on the file name itself.
const SECRET = /(^|\/)(\.env(\..*)?|\.netrc|\.npmrc|\.pypirc|\.htpasswd|credentials|client_secret.*|secrets?\.(json|ya?ml|toml|ini|txt)|id_rsa|id_dsa|id_ecdsa|id_ed25519|.*\.(pem|key|pfx|p12|jks|keystore|ppk)|serviceaccount.*\.json|.*service-account.*\.json)$/i;
const BINARY = /\.(png|jpe?g|gif|bmp|ico|webp|svg|pdf|zip|gz|tar|rar|7z|exe|dll|so|dylib|bin|class|jar|woff2?|ttf|eot|mp[34]|mov|avi|mkv|wav|db|sqlite3?|pyc|lock)$/i;
const MAX_FILE  = 200 * 1024;      // 200 KB per file
const MAX_TOTAL = 1.5 * 1024 * 1024; // 1.5 MB total

const fmt = n => n < 1024 ? n + ' B'
              : n < 1048576 ? (n/1024).toFixed(1) + ' KB'
              : (n/1048576).toFixed(1) + ' MB';

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function bubble(role, text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || role);
  d.innerHTML = '<div class="who">' + esc(role) + '</div>'
              + '<div class="bubble"></div>';
  d.querySelector('.bubble').textContent = text || '';
  logInner.appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

// ---- attachments ----
async function addFiles(fileList){
  // Snapshot first: a FileList is live, and the caller clears the input
  // right after us. Iterating it across an await would lose the rest.
  const list = Array.from(fileList);
  let total = attachments.reduce((s,a)=>s+a.bytes,0);
  let skipped = [], secrets = [];
  for (const f of list){
    const path = f.webkitRelativePath || f.name;
    if (SKIP_DIR.test(path))      { skipped.push(path+' (ignored dir)'); continue; }
    if (SECRET.test(path))       { secrets.push(path);                  continue; }
    if (BINARY.test(path))        { skipped.push(path+' (binary)');      continue; }
    if (f.size > MAX_FILE)        { skipped.push(path+' (>200KB)');      continue; }
    if (total + f.size > MAX_TOTAL){ skipped.push(path+' (total cap)');  continue; }
    if (attachments.some(a=>a.path===path)) continue;
    const content = await f.text();
    attachments.push({path, content, bytes:f.size});
    total += f.size;
  }
  renderChips();
  if (secrets.length){
    $('hint').innerHTML = '<b style="color:var(--err)">Blocked ' + secrets.length
      + ' credential file(s), not sent: </b>' + secrets.slice(0,5).join(', ')
      + (secrets.length>5 ? ' …' : '');
    return;
  }
  if (skipped.length){
    $('hint').textContent = 'skipped ' + skipped.length + ' file(s): '
                          + skipped.slice(0,4).join(', ')
                          + (skipped.length>4 ? ' …' : '');
  }
}

function renderChips(){
  $('chips').innerHTML = '';
  const total = attachments.reduce((s,a)=>s+a.bytes,0);
  attachments.forEach((a,i)=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = '<b></b><span>'+fmt(a.bytes)+'</span><button title="remove">×</button>';
    c.querySelector('b').textContent = a.path;
    c.querySelector('button').onclick = ()=>{ attachments.splice(i,1); renderChips(); };
    $('chips').appendChild(c);
  });
  if (attachments.length){
    const s = document.createElement('div');
    s.className = 'chip';
    s.style.background = 'transparent';
    s.style.border = '0';
    s.innerHTML = '<span>' + attachments.length + ' file(s), ' + fmt(total)
                + ' ≈ ' + Math.round(total/4).toLocaleString() + ' tokens</span>';
    $('chips').appendChild(s);
  }
  renderTotal();
}

$('addFiles').onclick  = ()=> $('fileInput').click();
$('addFolder').onclick = ()=> $('folderInput').click();
$('fileInput').onchange   = e => { addFiles([...e.target.files]); e.target.value=''; };
$('folderInput').onchange = e => { addFiles([...e.target.files]); e.target.value=''; };

$('clear').onclick = ()=>{
  history = []; attachments = [];
  sessionCost = 0; sessionTokens = 0; sessionTurns = 0;
  logInner.innerHTML = ''; renderChips(); renderTotal();
  $('hint').textContent = 'conversation and running total cleared';
};

// ---- sending ----
// Fold attachments into the message text itself, so the files stay in the
// conversation history and remain visible to the model on later turns.
function buildBlock(files){
  if (!files.length) return '';
  const tree = files.map(a=>'  '+a.path).join('\n');
  let out = 'The user attached ' + files.length + ' file(s):\n' + tree + '\n\nFile contents follow.\n';
  for (const a of files) out += '\n===== ' + a.path + ' =====\n' + a.content + '\n';
  return out + '\n';
}

async function send(){
  const text = $('input').value.trim();
  if ((!text && !attachments.length) || busy) return;

  const sending = attachments.slice();
  const userMsg = bubble('you', text, 'user');
  if (sending.length){
    const f = document.createElement('div');
    f.className = 'files';
    f.textContent = '📎 ' + sending.map(a=>a.path).join(', ');
    userMsg.appendChild(f);
  }

  history.push({role:'user', content: buildBlock(sending) + text});
  $('input').value = '';
  attachments = []; renderChips();

  busy = true; $('send').disabled = true;
  const model = $('model').value;
  const out = bubble(model, '', 'assistant');
  const body = out.querySelector('.bubble');
  body.classList.add('cursor');

  let acc = '', usage = null, served = null;
  try{
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model, messages:history, effort: $('effort').value})
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', finished = false;
    while(!finished){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines){
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'delta'){ acc += ev.text; body.textContent = acc; }
        else if (ev.type === 'usage') usage = ev;
        else if (ev.type === 'model'){
          served = ev.model;
          // show ground truth from the API, not just what we asked for
          out.querySelector('.who').textContent = served;
        }
        else if (ev.type === 'done'){ finished = true; }
        else if (ev.type === 'notice'){ $('hint').textContent = ev.message; }
        else if (ev.type === 'error'){
          out.className = 'msg err';
          acc += (acc ? '\n\n' : '') + 'Error: ' + ev.message;
          body.textContent = acc;
        }
        $('log').scrollTop = $('log').scrollHeight;
      }
    }
  }catch(e){
    out.className = 'msg err';
    body.textContent = acc + '\n\nConnection error: ' + e.message;
  }

  body.classList.remove('cursor');
  if (acc) history.push({role:'assistant', content:acc});
  if (usage){
    sessionTurns++;
    sessionCost   += Number(usage.cost) || 0;
    sessionTokens += Number(usage.total_tokens) || 0;
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = (served ? 'served by ' + served + '  ·  ' : '')
      + (usage.total_tokens ?? '?') + ' tokens'
      + (usage.reasoning_tokens ? '  ·  ' + usage.reasoning_tokens + ' reasoning' : '')
      + (usage.cost != null ? '  ·  $' + Number(usage.cost).toFixed(5) : '');
    out.appendChild(m);
  }
  renderTotal();
  busy = false; $('send').disabled = false; $('input').focus();
}

$('send').onclick = send;
$('input').addEventListener('keydown', e=>{
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('input').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

// ---- startup ----
(async ()=>{
  try{
    const cfg = await (await fetch('/api/config')).json();
    const {models} = await (await fetch('/api/models')).json();
    const sel = $('model');
    sel.innerHTML = '';
    (models || [cfg.model]).forEach(id=>{
      const o = document.createElement('option');
      o.value = id; o.textContent = id;
      if (id === cfg.model) o.selected = true;
      sel.appendChild(o);
    });
    $('hint').textContent = models.length + ' models available · '
                          + 'attach files or a whole folder to send them as context';
  }catch(e){
    $('hint').textContent = 'could not reach the server: ' + e.message;
  }
})();
</script>
</body>
</html>
